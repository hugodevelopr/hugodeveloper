<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1981px" preserveAspectRatio="xMidYMid meet" style="width:2195px;height:750px;" version="1.1" viewBox="0 0 2195 1981" width="2195px" zoomAndPan="magnify"><title>Azure Governance</title><defs/><g><g class="title" data-source-line="1"><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="162.9072" x="1009.1907" y="22.9951">Azure Governance</text></g><!--cluster L0--><g class="cluster" data-qualified-name="L0" data-source-line="37" id="ent0002"><rect fill="none" height="136.18" rx="8" ry="8" style="stroke:#666666;stroke-width:1;" width="806" x="511" y="44.2969"/><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="250.209" x="514" y="59.292">1) Org Intent (Non-negotiables)</text></g><!--cluster L1--><g class="cluster" data-qualified-name="L1" data-source-line="46" id="ent0006"><rect fill="none" height="493.16" rx="8" ry="8" style="stroke:#666666;stroke-width:1;" width="391" x="700" y="229.4769"/><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="375.874" x="703" y="244.472">2) Azure Hierarchy (Where governance applies)</text></g><!--cluster L2--><g class="cluster" data-qualified-name="L2" data-source-line="55" id="ent0010"><rect fill="none" height="185.08" rx="8" ry="8" style="stroke:#666666;stroke-width:1;" width="1241" x="7" y="771.6369"/><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="284.6826" x="10" y="786.632">3) Guardrails (Enforced constraints)</text></g><!--cluster L3--><g class="cluster" data-qualified-name="L3" data-source-line="65" id="ent0015"><rect fill="none" height="460.56" rx="8" ry="8" style="stroke:#666666;stroke-width:1;" width="284" x="919" y="1005.7169"/><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="257.3867" x="922" y="1020.712">4) Execution (Inside boundaries)</text></g><!--cluster L4--><g class="cluster" data-qualified-name="L4" data-source-line="74" id="ent0019"><rect fill="none" height="168.78" rx="8" ry="8" style="stroke:#666666;stroke-width:1;" width="996" x="583" y="1515.2769"/><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="289.6455" x="586" y="1530.272">5) Signals (Constraints flow upward)</text></g><!--cluster L5--><g class="cluster" data-qualified-name="L5" data-source-line="84" id="ent0024"><rect fill="none" height="136.19" rx="8" ry="8" style="stroke:#666666;stroke-width:1;" width="776" x="819" y="1733.0569"/><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="311.2402" x="822" y="1748.052">6) Governance Evolution (Adjustments)</text></g><!--entity INT_REG--><g class="entity" data-qualified-name="L0.INT_REG" data-source-line="38" id="ent0003"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="230.4717" x="526.76" y="79.2969"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="158.915" x="536.76" y="102.292">Regulatory constraints</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="167.2822" x="536.76" y="118.5889">- isolation requirements</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="182.8545" x="536.76" y="134.8857">- auditability expectations</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="210.4717" x="536.76" y="151.1826">- data residency / region rules</text></g><!--entity INT_COST--><g class="entity" data-qualified-name="L0.INT_COST" data-source-line="39" id="ent0004"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="233.3906" x="792.3" y="79.2969"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="134.2578" x="802.3" y="102.292">Cost accountability</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="148.7158" x="802.3" y="118.5889">- owner per workload</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="141.8047" x="802.3" y="134.8857">- budget boundaries</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="213.3906" x="802.3" y="151.1826">- chargeback/showback model</text></g><!--entity INT_OPS--><g class="entity" data-qualified-name="L0.INT_OPS" data-source-line="40" id="ent0005"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="240.3223" x="1060.84" y="79.2969"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="176.8662" x="1070.84" y="102.292">Operational expectations</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="142.3652" x="1070.84" y="118.5889">- incident ownership</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="220.3223" x="1070.84" y="134.8857">- production readiness baseline</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="173.8105" x="1070.84" y="151.1826">- SLO / reliability posture</text></g><!--entity ROOT--><g class="entity" data-qualified-name="L1.ROOT" data-source-line="47" id="ent0007"><rect fill="#313139" height="68.8906" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="204.2354" x="806.88" y="264.4769"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="85.7773" x="816.88" y="287.472">Tenant Root</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="184.2354" x="816.88" y="303.7689">Minimal global constraints</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="178.1855" x="816.88" y="320.0657">(avoid heavy policy here)</text></g><!--entity MG--><g class="entity" data-qualified-name="L1.MG" data-source-line="48" id="ent0008"><rect fill="#313139" height="101.4844" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="277.9951" x="797" y="410.3669"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="146.8975" x="807" y="433.362">Management Groups</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="257.9951" x="807" y="449.6589">Control domains (policy blast radius)</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="194.9883" x="807" y="465.9557">Regulated vs non-regulated</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="151.6963" x="807" y="482.2526">Critical vs non-critical</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="137.9219" x="807" y="498.5495">Platform vs product</text></g><!--entity SUB--><g class="entity" data-qualified-name="L1.SUB" data-source-line="49" id="ent0009"><rect fill="#313139" height="117.7813" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="220.2041" x="796.9" y="588.8569"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="94.2813" x="806.9" y="611.852">Subscriptions</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="153.918" x="806.9" y="628.1489">Primary boundary for:</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="200.2041" x="806.9" y="644.4457">- ownership &amp; accountability</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="38.5479" x="806.9" y="660.7426">- cost</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="48.1865" x="806.9" y="677.0395">- RBAC</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="149.5156" x="806.9" y="693.3364">- failure / blast radius</text></g><!--entity POLICY--><g class="entity" data-qualified-name="L2.POLICY" data-source-line="56" id="ent0011"><rect fill="#313139" height="117.7813" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="271.4258" x="312.29" y="814.7869"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="174.4395" x="322.29" y="837.782">Azure Policy + Initiatives</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="54.5713" x="322.29" y="854.0789">Use for:</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="5.0518" x="322.29" y="870.3757">-</text><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="38.6094" x="331.792" y="870.3757">deny</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="112.9434" x="374.8515" y="870.3757">non-negotiables</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="5.0518" x="322.29" y="886.6726">-</text><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="54.2432" x="331.792" y="886.6726">modify</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="65.9326" x="390.4853" y="886.6726">baselines</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="5.0518" x="322.29" y="902.9695">-</text><text fill="#bebec1" font-family="Inter" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40.9268" x="331.792" y="902.9695">audit</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="57.6885" x="377.1689" y="902.9695">visibility</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="251.4258" x="322.29" y="919.2664">Anti-pattern: audit-only everywhere</text></g><!--entity RBAC--><g class="entity" data-qualified-name="L2.RBAC" data-source-line="57" id="ent0012"><rect fill="#313139" height="134.0781" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="256.0244" x="975.99" y="806.6369"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="85.1689" x="985.99" y="829.632">RBAC Model</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="116.5186" x="985.99" y="845.9289">Rules that scale:</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="185.6025" x="985.99" y="862.2257">- groups-only assignments</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="183.8594" x="985.99" y="878.5226">- least privilege by default</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="236.0244" x="985.99" y="894.8195">- avoid subscription-wide humans</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="219.7617" x="985.99" y="911.1164">- time-bound elevation for prod</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="146.1592" x="985.99" y="927.4132">- review drift as debt</text></g><!--entity STD--><g class="entity" data-qualified-name="L2.STD" data-source-line="58" id="ent0013"><rect fill="#313139" height="117.7813" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="322.6953" x="618.65" y="814.7869"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="71.2305" x="628.65" y="837.782">Standards</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="187.585" x="628.65" y="854.0789">Make cost &amp; ops tractable:</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="302.6953" x="628.65" y="870.3757">- tagging (owner, costCenter, domain, env)</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="62.2412" x="628.65" y="886.6726">- naming</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="160.0293" x="628.65" y="902.9695">- allowed regions/SKUs</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="217.5195" x="628.65" y="919.2664">- lifecycle (expiration, cleanup)</text></g><!--entity LZ--><g class="entity" data-qualified-name="L2.LZ" data-source-line="59" id="ent0014"><rect fill="#313139" height="117.7813" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="253.707" x="23.15" y="814.7869"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="177.9053" x="33.15" y="837.782">Landing Zones (Baseline)</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="233.707" x="33.15" y="854.0789">What 'good' looks like by default:</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="129.4453" x="33.15" y="870.3757">- network baseline</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="200.2246" x="33.15" y="886.6726">- logging/diagnostics routing</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="128.4883" x="33.15" y="902.9695">- security baseline</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="175.9092" x="33.15" y="919.2664">- deployment boundaries</text></g><!--entity TEAMS--><g class="entity" data-qualified-name="L3.TEAMS" data-source-line="66" id="ent0016"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="184.1104" x="1002.94" y="1040.7169"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="139.9795" x="1012.94" y="1063.712">Teams &amp; Workloads</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="142.5771" x="1012.94" y="1080.0089">Autonomous squads</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="164.1104" x="1012.94" y="1096.3057">Own runtime outcomes</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="117.3047" x="1012.94" y="1112.6026">within guardrails</text></g><!--entity CICD--><g class="entity" data-qualified-name="L3.CICD" data-source-line="67" id="ent0017"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="252.5586" x="934.72" y="1202.9069"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="82.291" x="944.72" y="1225.902">CI/CD + IaC</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="232.5586" x="944.72" y="1242.1989">Deploy without human approvals</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="144.8193" x="944.72" y="1258.4957">as long as compliant</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="181.1113" x="944.72" y="1274.7926">(guardrails replace gates)</text></g><!--entity RUNTIME--><g class="entity" data-qualified-name="L3.RUNTIME" data-source-line="68" id="ent0018"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="194.4189" x="934.79" y="1365.0869"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="59.1035" x="944.79" y="1388.082">Runtime</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="165.2246" x="944.79" y="1404.3789">Services, data, network</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="174.4189" x="944.79" y="1420.6757">Live production behavior</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="87.1924" x="944.79" y="1436.9726">under stress</text></g><!--entity SIG_POLICY--><g class="entity" data-qualified-name="L4.SIG_POLICY" data-source-line="75" id="ent0020"><rect fill="#313139" height="101.4844" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="178.7578" x="598.62" y="1558.4269"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="93.9258" x="608.62" y="1581.422">Policy signals</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="137.8262" x="608.62" y="1597.7189">- denies (hard stop)</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="118.8906" x="608.62" y="1614.0157">- violations trend</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="92.5381" x="608.62" y="1630.3126">Rate &gt; count</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="158.7578" x="608.62" y="1646.6095">Exceptions with expiry</text></g><!--entity SIG_COST--><g class="entity" data-qualified-name="L4.SIG_COST" data-source-line="76" id="ent0021"><rect fill="#313139" height="101.4844" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="198.5342" x="1100.73" y="1558.4269"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="84.2803" x="1110.73" y="1581.422">Cost signals</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="121.5703" x="1110.73" y="1597.7189">- drift vs baseline</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="81.4229" x="1110.73" y="1614.0157">- anomalies</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="178.5342" x="1110.73" y="1630.3126">- spend by owner/domain</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="175.3145" x="1110.73" y="1646.6095">(not just by subscription)</text></g><!--entity SIG_RBAC--><g class="entity" data-qualified-name="L4.SIG_RBAC" data-source-line="77" id="ent0022"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="252.6953" x="812.65" y="1566.5769"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="101.3291" x="822.65" y="1589.572">Access signals</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="175.6768" x="822.65" y="1605.8689">- role assignment growth</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="114.2285" x="822.65" y="1622.1657">- privilege creep</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="232.6953" x="822.65" y="1638.4626">- emergency access permanence</text></g><!--entity SIG_FRICTION--><g class="entity" data-qualified-name="L4.SIG_FRICTION" data-source-line="78" id="ent0023"><rect fill="#313139" height="117.7813" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="228.6602" x="1334.67" y="1550.2769"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="105.3691" x="1344.67" y="1573.272">Friction signals</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="100.8301" x="1344.67" y="1589.5689">Early warning:</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="123.9971" x="1344.67" y="1605.8657">- bypass requests</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="208.6602" x="1344.67" y="1622.1626">- platform pulled into delivery</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="171.4248" x="1344.67" y="1638.4595">- 'temporary' exceptions</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="156.126" x="1344.67" y="1654.7564">- political cost reviews</text></g><!--entity EVOLVE_POLICY--><g class="entity" data-qualified-name="L5.EVOLVE_POLICY" data-source-line="85" id="ent0025"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="207.4961" x="835.25" y="1768.0569"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="126.8955" x="845.25" y="1791.052">Refine constraints</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="151.6348" x="845.25" y="1807.3489">- tighten deny/modify</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="187.4961" x="845.25" y="1823.6457">- reduce exception surface</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="164.3291" x="845.25" y="1839.9426">- standardize initiatives</text></g><!--entity EVOLVE_TOPO--><g class="entity" data-qualified-name="L5.EVOLVE_TOPO" data-source-line="86" id="ent0026"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="241.0059" x="1337.5" y="1768.0569"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="143.2539" x="1347.5" y="1791.052">Reshape boundaries</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="113.8662" x="1347.5" y="1807.3489">- MG regrouping</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="221.0059" x="1347.5" y="1823.6457">- subscription strategy changes</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="166.1543" x="1347.5" y="1839.9426">- new domains / re-orgs</text></g><!--entity EVOLVE_OWN--><g class="entity" data-qualified-name="L5.EVOLVE_OWN" data-source-line="87" id="ent0027"><rect fill="#313139" height="85.1875" rx="8" ry="8" style="stroke:#666666;stroke-width:0.5;" width="224.709" x="1077.65" y="1768.0569"/><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="121.7549" x="1087.65" y="1791.052">Clarify ownership</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="184.9326" x="1087.65" y="1807.3489">- budgets &amp; accountability</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="204.709" x="1087.65" y="1823.6457">- incident/runbook ownership</text><text fill="#bebec1" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="161.1162" x="1087.65" y="1839.9426">- lifecycle enforcement</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="134" id="ent0058"><path d="M1107.07,612.9169 L1107.07,643.7469 L1017.49,647.7469 L1107.07,651.7469 L1107.07,682.5809 A8,8 0 0 0 1115.07,690.5809 L1492.9377,690.5809 A8,8 0 0 0 1500.9377,682.5809 L1500.9377,614.9169 L1490.9377,604.9169 L1115.07,604.9169 A8,8 0 0 0 1107.07,612.9169" fill="#714137" style="stroke:#888888;stroke-width:0.5;"/><path d="M1490.9377,604.9169 L1490.9377,610.9169 A4,4 0 0 0 1494.9377,614.9169 L1500.9377,614.9169 L1490.9377,604.9169" fill="#714137" style="stroke:#888888;stroke-width:0.5;"/><text fill="#bebec1" font-family="Inter" font-size="13" font-weight=