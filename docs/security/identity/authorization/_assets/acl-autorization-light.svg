,519.7509 L3152.2348,519.7509 A7,7 0 0 0 3159.2348,512.7509 L3159.2348,444.0869 L3149.2348,434.0869 L2777.02,434.0869 A7,7 0 0 0 2770.02,441.0869" fill="#FFF7DB" filter="url(#fempzo8151sc9)" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M3149.2348,434.0869 L3149.2348,440.5869 A3.5,3.5 0 0 0 3152.7348,444.0869 L3159.2348,444.0869 L3149.2348,434.0869" fill="#FFF7DB" style="stroke:#C9A227;stroke-width:1;"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="168.1113" x="2776.02" y="451.1538">Evaluator responsibilities:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="368.2148" x="2776.02" y="466.2866">- principal expansion (user + groups + service principal)</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="252.5859" x="2776.02" y="481.4194">- strict tenant boundary (zero leakage)</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="231.7847" x="2776.02" y="496.5522">- correctness semantics for caching</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="151.8677" x="2776.02" y="511.685">- explainability payload</text></g><g class="entity" data-qualified-name="GMN75" data-source-line="161" id="ent0076"><path d="M2382.22,750.6469 L2382.22,822.3109 A7,7 0 0 0 2389.22,829.3109 L2652.0305,829.3109 A7,7 0 0 0 2659.0305,822.3109 L2659.0305,753.6469 L2649.0305,743.6469 L2389.22,743.6469 A7,7 0 0 0 2382.22,750.6469" fill="#FFF7DB" filter="url(#fempzo8151sc9)" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M2649.0305,743.6469 L2649.0305,750.1469 A3.5,3.5 0 0 0 2652.5305,753.6469 L2659.0305,753.6469 L2649.0305,743.6469" fill="#FFF7DB" style="stroke:#C9A227;stroke-width:1;"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="255.8105" x="2388.22" y="760.7138">Batch authorization must be first-class:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="40.2695" x="2388.22" y="775.8466">- TVPs</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="164.417" x="2388.22" y="790.9794">- set-based query shapes</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="87.4961" x="2388.22" y="806.1122">- stable plans</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="192.4546" x="2388.22" y="821.245">Avoid per-item checks (N+1).</text></g><g class="entity" data-qualified-name="GMN83" data-source-line="178" id="ent0084"><path d="M2382.21,441.0869 L2382.21,501.0069 L840.78,505.0069 L2382.21,509.0069 L2382.21,512.7509 A7,7 0 0 0 2389.21,519.7509 L2728.0464,519.7509 A7,7 0 0 0 2735.0464,512.7509 L2735.0464,444.0869 L2725.0464,434.0869 L2389.21,434.0869 A7,7 0 0 0 2382.21,441.0869" fill="#FFF7DB" filter="url(#fempzo8151sc9)" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M2725.0464,434.0869 L2725.0464,440.5869 A3.5,3.5 0 0 0 2728.5464,444.0869 L2735.0464,444.0869 L2725.0464,434.0869" fill="#FFF7DB" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="215.376" x="2388.21" y="451.1538">Revocation correctness strategy:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="93.2661" x="2388.21" y="466.2866">- bounded TTL</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="171.666" x="2388.21" y="481.4194">- event-driven invalidation</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="223.2471" x="2388.21" y="496.5522">- optional principal_version keying</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="331.8364" x="2388.21" y="511.685">Explicit semantics per action r