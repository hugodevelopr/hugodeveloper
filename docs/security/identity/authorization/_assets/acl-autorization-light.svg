xt fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="303.3926" x="2969.0537" y="1670.1895">C = Context (tenant + scope + delegation)</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="188.0088" x="2969.0537" y="1686.4864">T = Time (validity window)</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="2969.0537" y="1702.7832">&#160;</text><line style="stroke:#2E2E2E;stroke-width:1;" x1="2964.0537" x2="3107.0713" y1="1714.2334" y2="1714.2334"/><line style="stroke:#2E2E2E;stroke-width:1;" x1="2964.0537" x2="3107.0713" y1="1716.2334" y2="1716.2334"/><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="114.543" x="3111.5215" y="1718.5801">Non-negotiables</text><line style="stroke:#2E2E2E;stroke-width:1;" x1="3230.5147" x2="3373.5322" y1="1714.2334" y2="1714.2334"/><line style="stroke:#2E2E2E;stroke-width:1;" x1="3230.5147" x2="3373.5322" y1="1716.2334" y2="1716.2334"/><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="292.8516" x="2969.0537" y="1735.377">- Keycloak: identity &amp; coarse context only</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="335.1045" x="2969.0537" y="1751.6739">- No ACL in JWT (avoid bloat + revocation bugs)</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="322.9639" x="2969.0537" y="1767.9707">- Enforcement local in services (deterministic)</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="399.4785" x="2969.0537" y="1784.2676">- SQL Server authoritative store (query-shaped, indexed)</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="335.3916" x="2969.0537" y="1800.5645">- Batch auth for list endpoints (TVPs, set-based)</text><text fill="#000000" font-