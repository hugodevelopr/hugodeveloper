<?plantuml 1.2026.2beta3?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1451px" preserveAspectRatio="xMidYMin meet" style="width:4135px;height:1451px;background:#FFFFFF;" version="1.1" viewBox="0 0 4135 1451" width="4135px" zoomAndPan="magnify"><title>RPS vs Tail Latency (p95/p99) &#8212; .NET Production Mental Model</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="498.4014" x="1811.6122" y="22.9951">RPS vs Tail Latency (p95/p99) &#8212; .NET Production Mental Model</text></g><!--cluster TW--><g class="cluster" data-qualified-name="TW" data-source-line="19" id="ent0003"><rect fill="none" height="123.26" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="431" x="7" y="174.0969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="115.5137" x="164.7432" y="189.092">Traffic Pattern</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="129.4248" x="157.7876" y="205.3889">(open workload)</text></g><!--cluster S--><g class="cluster" data-qualified-name="S" data-source-line="26" id="ent0007"><rect fill="none" height="987.33" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="248" x="325" y="362.3569"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="171.5684" x="363.2158" y="377.352">ASP.NET Core Service</text></g><!--cluster D--><g class="cluster" data-qualified-name="D" data-source-line="59" id="ent0027"><path d="M615.5,1209.5969 L911.6348,1209.5969 A3.75,3.75 0 0 1 914.1348,1212.0969 L921.1348,1248.1906 L1314.5,1248.1906 A2.5,2.5 0 0 1 1317,1250.6906 L1317,1351.6869 A2.5,2.5 0 0 1 1314.5,1354.1869 L615.5,1354.1869 A2.5,2.5 0 0 1 613,1351.6869 L613,1212.0969 A2.5,2.5 0 0 1 615.5,1209.5969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="613" x2="921.1348" y1="1248.1906" y2="1248.1906"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.4824" x="656.8262" y="1224.592">Downstream Dependencies</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="295.1348" x="617" y="1240.8889">(latency distributions, not constants)</text></g><!--cluster RT--><g class="cluster" data-qualified-name="RT" data-source-line="94" id="ent0048"><path d="M1359.5,1019.0269 L1542.377,1019.0269 A3.75,3.75 0 0 1 1544.877,1021.5269 L1551.877,1041.3238 L1745.5,1041.3238 A2.5,2.5 0 0 1 1748,1043.8238 L1748,1347.1869 A2.5,2.5 0 0 1 1745.5,1349.6869 L1359.5,1349.6869 A2.5,2.5 0 0 1 1357,1347.1869 L1357,1021.5269 A2.5,2.5 0 0 1 1359.5,1019.0269" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="1357" x2="1551.877" y1="1041.3238" y2="1041.3238"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="181.877" x="1361" y="1034.022">.NET Runtime Pressure</text></g><!--cluster CTRL--><g class="cluster" data-qualified-name="CTRL" data-source-line="114" id="ent0059"><path d="M833.5,520.9569 L1023.165,520.9569 A3.75,3.75 0 0 1 1025.665,523.4569 L1032.665,543.2538 L1265.5,543.2538 A2.5,2.5 0 0 1 1268,545.7538 L1268,975.5269 A2.5,2.5 0 0 1 1265.5,978.0269 L833.5,978.0269 A2.5,2.5 0 0 1 831,975.5269 L831,523.4569 A2.5,2.5 0 0 1 833.5,520.9569" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="831" x2="1032.665" y1="543.2538" y2="543.2538"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="188.665" x="835" y="535.952">Signals &amp; Control Loops</text></g><g class="entity" data-qualified-name="TW.GMN4" data-source-line="21" id="ent0005"><path d="M30.92,233.0969 L30.92,273.3625 A0,0 0 0 0 30.92,273.3625 L395.0806,273.3625 A0,0 0 0 0 395.0806,273.3625 L395.0806,243.0969 L385.0806,233.0969 L229.41,233.0969 L300.43,114.3769 L221.41,233.0969 L30.92,233.0969 A0,0 0 0 0 30.92,233.0969" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M385.0806,233.0969 L385.0806,243.0969 L395.0806,243.0969 L385.0806,233.0969" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.1606" x="36.92" y="250.1638">Requests arrive regardless of service response time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.3604" x="36.92" y="265.2966">Closed-workload load tests can hide the cliff.</text></g><!--entity K--><g class="entity" data-qualified-name="S.K" data-source-line="27" id="ent0008"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="152.959" x="353.52" y="405.3569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="48.8359" x="363.52" y="428.352">Kestrel</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.959" x="363.52" y="444.6489">accept + socket IO</text></g><!--entity Q--><g class="entity" data-qualified-name="S.Q" data-source-line="28" id="ent0009"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="141.5566" x="359.22" y="564.0969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.9395" x="369.22" y="587.092">Request Queue</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.5566" x="369.22" y="603.3889">(bound/unbound)</text></g><!--entity TP--><g class="entity" data-qualified-name="S.TP" data-source-line="29" id="ent0010"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="135.4932" x="391.25" y="754.9869"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.4932" x="401.25" y="777.982">.NET ThreadPool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.2441" x="401.25" y="794.2789">hill-climbing</text></g><!--entity MW--><g class="entity" data-qualified-name="S.MW" data-source-line="30" id="ent0011"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="183.3789" x="356.31" y="909.4369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.6436" x="366.31" y="932.432">Middleware</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.3789" x="366.31" y="948.7289">(per-request overhead)</text></g><!--entity H--><g class="entity" data-qualified-name="S.H" data-source-line="31" id="ent0012"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="191.7666" x="349.12" y="1070.1769"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.7666" x="359.12" y="1093.172">Handler / Business Logic</text></g><!--entity SER--><g class="entity" data-qualified-name="S.SER" data-source-line="32" id="ent0013"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="151.8311" x="349.08" y="1273.0969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.249" x="359.08" y="1296.092">Serialization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.8311" x="359.08" y="1312.3889">(System.Text.Json)</text></g><!--entity DB--><g class="entity" data-qualified-name="D.DB" data-source-line="60" id="ent0028"><path d="M637.17,1278.5969 C637.17,1268.5969 739.004,1268.5969 739.004,1268.5969 C739.004,1268.5969 840.838,1268.5969 840.838,1278.5969 L840.838,1320.1906 C840.838,1330.1906 739.004,1330.1906 739.004,1330.1906 C739.004,1330.1906 637.17,1330.1906 637.17,1320.1906 L637.17,1278.5969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M637.17,1278.5969 C637.17,1288.5969 739.004,1288.5969 739.004,1288.5969 C739.004,1288.5969 840.838,1288.5969 840.838,1278.5969" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="20.3848" x="647.17" y="1305.592">DB</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.668" x="647.17" y="1321.8889">(EF Core + ADO.NET pool)</text></g><!--entity R--><g class="entity" data-qualified-name="D.R" data-source-line="61" id="ent0029"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="72.3838" x="875.81" y="1273.0969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.4111" x="885.81" y="1296.092">Redis</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.3838" x="885.81" y="1312.3889">(cache)</text></g><!--entity API--><g class="entity" data-qualified-name="D.API" data-source-line="62" id="ent0030"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="112.1963" x="982.9" y="1281.2369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.1963" x="992.9" y="1304.232">3rd-party API</text></g><!--entity MQ--><g class="entity" data-qualified-name="D.MQ" data-source-line="63" id="ent0031"><path d="M1135.1,1278.0969 L1268.9057,1278.0969 C1273.9057,1278.0969 1273.9057,1299.3938 1273.9057,1299.3938 C1273.9057,1299.3938 1273.9057,1320.6906 1268.9057,1320.6906 L1135.1,1320.6906 C1130.1,1320.6906 1130.1,1299.3938 1130.1,1299.3938 C1130.1,1299.3938 1130.1,1278.0969 1135.1,1278.0969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1268.9057,1278.0969 C1263.9057,1278.0969 1263.9057,1299.3938 1263.9057,1299.3938 C1263.9057,1320.6906 1268.9057,1320.6906 1268.9057,1320.6906" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.6045" x="1135.1" y="1296.092">Kafka/ServiceBus</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.8057" x="1135.1" y="1312.3889">(Async boundary)</text></g><!--entity AL--><g class="entity" data-qualified-name="RT.AL" data-source-line="95" id="ent0049"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="139.2734" x="1381.36" y="1070.1769"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.2734" x="1391.36" y="1093.172">Allocations / LOH</text></g><!--entity GC--><g class="entity" data-qualified-name="RT.GC" data-source-line="96" id="ent0050"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="175.8525" x="1454.07" y="1273.0969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.4883" x="1464.07" y="1296.092">GC (Gen0/1/2)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.8525" x="1464.07" y="1312.3889">stop-the-world pauses</text></g><!--entity CS--><g class="entity" data-qualified-name="RT.CS" data-source-line="97" id="ent0051"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="148.4336" x="1555.78" y="1062.0269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.8838" x="1565.78" y="1085.022">Context switching</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.4336" x="1565.78" y="1101.3189">(thread explosion)</text></g><!--entity MET--><g class="entity" data-qualified-name="CTRL.MET" data-source-line="115" id="ent0060"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.8223" x="847.09" y="555.9569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.8184" x="857.09" y="578.952">Metrics</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.8223" x="857.09" y="595.2489">p50/p95/p99, queue length,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.3359" x="857.09" y="611.5457">pool wait, % time in GC</text></g><!--entity LL--><g class="entity" data-qualified-name="CTRL.LL" data-source-line="116" id="ent0061"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="159.7061" x="847.15" y="754.9869"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.666" x="857.15" y="777.982">Capacity Model</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.7061" x="857.15" y="794.2789">(Little's Law, M/M/c)</text></g><!--entity AS--><g class="entity" data-qualified-name="CTRL.AS" data-source-line="117" id="ent0062"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194.4053" x="846.8" y="909.4369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.9219" x="856.8" y="932.432">Scaling Policy</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.4053" x="856.8" y="948.7289">(latency-based, not CPU)</text></g><!--entity SV--><g class="entity" data-qualified-name="CTRL.SV" data-source-line="118" id="ent0063"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="209.3896" x="1042.31" y="746.8469"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.4707" x="1052.31" y="769.842">Safety Valves</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.3896" x="1052.31" y="786.1389">(load shedding, bulkheads,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.8096" x="1052.31" y="802.4357">circuit breakers)</text></g><!--entity C--><g class="entity" data-qualified-name="C" data-source-line="17" id="ent0002"><ellipse cx="320.9951" cy="51.2969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M320.9951,59.2969 L320.9951,86.2969 M307.9951,67.2969 L333.9951,67.2969 M320.9951,86.2969 L307.9951,101.2969 M320.9951,86.2969 L333.9951,101.2969" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.5303" x="300.73" y="115.792">Client</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="45" id="ent0022"><path d="M1283.64,562.6969 L1283.64,618.0953 L1544.3656,618.0953 L1544.3656,572.6969 L1534.3656,562.6969 L1283.64,562.6969" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1534.3656,562.6969 L1534.3656,572.6969 L1544.3656,572.6969 L1534.3656,562.6969" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.9634" x="1289.64" y="579.7638">If queue is unbounded:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.7256" x="1289.64" y="594.8966">latency grows without backpressure.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7153" x="1289.64" y="610.0294">Prefer bounded + 429/503.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="51" id="ent0025"><path d="M1286.25,753.5869 L1286.25,808.9853 L1741.7407,808.9853 L1741.7407,763.5869 L1731.7407,753.5869 L1286.25,753.5869" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1731.7407,753.5869 L1731.7407,763.5869 L1741.7407,763.5869 L1731.7407,753.5869" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.6343" x="1292.25" y="770.6538">Starvation trigger:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.4907" x="1292.25" y="785.7866">sync-over-async (.Result/.Wait)\nblocking IO holds worker threads.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.6099" x="1292.25" y="800.9194">Signal: ThreadPool Queue Length &#8593;</text></g><g class="entity" data-qualified-name="GMN36" data-source-line="72" id="ent0037"><path d="M1771.88,1279.2569 L1771.88,1319.5225 L2264.111,1319.5225 L2264.111,1289.2569 L2254.111,1279.2569 L1771.88,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M2254.111,1279.2569 L2254.111,1289.2569 L2264.111,1289.2569 L2254.111,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.9614" x="1777.88" y="1296.3238">Connection Pool Ceiling:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="471.231" x="1777.88" y="1311.4566">Max Pool Size (default ~100)\n=&gt; queue-for-connection =&gt; p99 spikes.</text></g><g class="entity" data-qualified-name="GMN39" data-source-line="77" id="ent0040"><path d="M2298.88,1279.2569 L2298.88,1319.5225 L2783.1256,1319.5225 L2783.1256,1289.2569 L2773.1256,1279.2569 L2298.88,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M2773.1256,1279.2569 L2773.1256,1289.2569 L2783.1256,1289.2569 L2773.1256,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.9404" x="2304.88" y="1296.3238">Cache stampede:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="463.2456" x="2304.88" y="1311.4566">invalidation =&gt; thundering herd\n=&gt; DB contention =&gt; tail explosion.</text></g><g class="entity" data-qualified-name="GMN42" data-source-line="82" id="ent0043"><path d="M2817.92,1279.2569 L2817.92,1319.5225 L3192.0782,1319.5225 L3192.0782,1289.2569 L3182.0782,1279.2569 L2817.92,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M3182.0782,1279.2569 L3182.0782,1289.2569 L3192.0782,1289.2569 L3182.0782,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.1528" x="2823.92" y="1296.3238">Variance compounds:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.1582" x="2823.92" y="1311.4566">sequential calls add tails;\nparallel calls take max tail.</text></g><g class="entity" data-qualified-name="GMN45" data-source-line="87" id="ent0046"><path d="M3227.26,1279.2569 L3227.26,1319.5225 L3612.7361,1319.5225 L3612.7361,1289.2569 L3602.7361,1279.2569 L3227.26,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M3602.7361,1279.2569 L3602.7361,1289.2569 L3612.7361,1289.2569 L3602.7361,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.2148" x="3233.26" y="1296.3238">Async shifts latency:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.4761" x="3233.26" y="1311.4566">request path stabilizes;\nend-to-end becomes eventual.</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="107" id="ent0057"><path d="M3647.37,1279.2569 L3647.37,1319.5225 L4128.6259,1319.5225 L4128.6259,1289.2569 L4118.6259,1279.2569 L3647.37,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M4118.6259,1279.2569 L4118.6259,1289.2569 L4128.6259,1289.2569 L4118.6259,1279.2569" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.3496" x="3653.37" y="1296.3238">Tail killer:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="460.2559" x="3653.37" y="1311.4566">Gen2 pauses (50-200ms)\nimpact many in-flight requests at high RPS.</text></g><g class="entity" data-qualified-name="GMN70" data-source-line="130" id="ent0071"><path d="M1985.35,908.0369 L1985.35,963.4353 L2220.6469,963.4353 L2220.6469,918.0369 L2210.6469,908.0369 L1985.35,908.0369" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M2210.6469,908.0369 L2210.6469,918.0369 L2220.6469,918.0369 L2210.6469,908.0369" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.4502" x="1991.35" y="925.1038">Critical constraint:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.2969" x="1991.35" y="940.2366">scale reacts AFTER latency rises.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5381" x="1991.35" y="955.3694">Need headroom + fast signals.</text></g><g class="entity" data-qualified-name="GMN75" data-source-line="142" id="ent0076"><path d="M1774.93,1053.0569 L1774.93,1123.5881 L2705.0604,1123.5881 L2705.0604,1063.0569 L2695.0604,1053.0569 L1774.93,1053.0569" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M2695.0604,1053.0569 L2695.0604,1063.0569 L2705.0604,1063.0569 L2695.0604,1053.0569" fill="#FAFAFA" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.0649" x="1780.93" y="1070.1238">Latency Cliff Pattern:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.0776" x="1780.93" y="1085.2566">Below saturation: latency ~flat</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="436.0396" x="1780.93" y="1100.3894">Near saturation (&#961;&#8594;1): queue wait ~ &#961; / (&#956;(1-&#961;)) =&gt; p99 shoots up</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="909.1304" x="1780.93" y="1115.5222">"Just add instances" fails when:\n- autoscaling lag\n- shared DB/Redis contention\n- USL &#946;&gt;0 (coherency) =&gt; throughput plateaus or drops</text></g><!--link TP to MW--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" data-source-line="34" id="lnk14"><path d="M457.16,807.8069 C455.13,835.9469 452.3111,874.9724 450.2811,903.1524" fill="none" id="TP-to-MW" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="449.85,909.1369,454.4863,900.4475,450.2093,904.1498,446.507,899.8727,449.85,909.1369" style="stroke:#181818;stroke-width:1;"/></g><!--link MW to H--><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" data-source-line="35" id="lnk15"><path d="M447.49,962.2769 C446.88,992.826