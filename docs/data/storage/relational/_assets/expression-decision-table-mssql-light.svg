 ruleset (pointer -&gt; version)</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="320.7661" x="3501.84" y="932.0422">3) Cache compiled delegates by (ruleset,version)</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="78.6411" x="3501.84" y="947.175">4) Evaluate:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="169.9077" x="3514.237" y="962.3078">- For each rule by priority:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="156.2539" x="3522.5016" y="977.4406">- conditionExpr =&gt; bool</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="314.228" x="3522.5016" y="992.5735">- if true: apply outcomeJson (outputs + reasons)</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="230.2104" x="3522.5016" y="1007.7063">- stopOnMatch or multi-hit stacking</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="148.2178" x="3501.84" y="1022.8391">5) Persist DecisionLog:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="357.792" x="3514.237" y="1037.9719">- inputs, outputs, appliedRuleIds, ruleset version, trace</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="119.0757" x="3501.84" y="1053.1047">6) Emit telemetry:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="345.3506" x="3514.237" y="1068.2375">- duration, cache hit/miss, errors, rule hit distribution</text><line style="stroke:#181818;stroke-width:1;" x1="3496.84" x2="3550.622" y1="882.1433" y2="882.1433"/><line style="stroke:#181818;stroke-width:1;" x1="3496.84" x2="3550.622" y1="884.1433" y2="884.1433"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="292.8428" x="3550.622" y="886.1438">Flow 1: Runtime Evaluation (facts &#8594; outputs)</text><line style="stroke:#181818;stroke-width:1;" x1="3843.4648" x2="3897.2467" y1="882.1433" y2="882.1433"/><line style="stroke:#181818;stroke-width:1;" x1="3843.4648" x2="3897.2467" y1="884.1433" y2="884.1433"/></g><g class="entity" data-qualified-name="GMN59" data-source-line="147" id="ent0060"><path d="M220.65,259.0869 L220.65,466.9462 A7,7 0 0 0 227.65,473.9462 L574.44,473.9462 A7,7 0 0 0 581.44,466.9462 L581.44,262.0869 L571.44,252.0869 L227.65,252.0869 A7,7 0 0 0 220.65,259.0869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M571.44,252.0869 L571.44,258.5869 A3.5,3.5 0 0 0 574.94,262.0869 L581.44,262.0869 L571.44,252.0869" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="339.79" x="226.65" y="269.1538">Concrete Applicability Example (Eligibility + Pricing)</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="38.8413" x="226.65" y="284.2866">Facts:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="142.9365" x="226.65" y="299.4194">- customer.type = VIP</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="181.7207" x="226.65" y="314.5522">- customer.kycLevel = FULL</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="115.4004" x="226.65" y="329.685">- risk.score = 812</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="158.52" x="226.65" y="344.8178">- order.amount = 15500</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="139.9658" x="226.65" y="359.9506">- partner.tier = GOLD</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="148.4336" x="226.65" y="375.0835">- order.channel = WEB</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="226.65" y="390.2163">&#160;</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="65.0317" x="226.65" y="405.3491">Expected:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="101.6069" x="226.65" y="420.4819">- eligible = true</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="92.1743" x="226.65" y="435.6147">- riskTier = 'A'</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="142.3335" x="226.65" y="450.7475">- discountRate = 0.12</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="246.7905" x="226.65" y="465.8803">- reasons include VIP + partner bonus</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="167" id="ent0063"><path d="M3493.21,234.3969 L3493.21,491.6547 A7,7 0 0 0 3500.21,498.6547 L3809.8804,498.6547 A7,7 0 0 0 3816.8804,491.6547 L3816.8804,237.3969 L3806.8804,227.3969 L3500.21,227.3969 A7,7 0 0 0 3493.21,234.3969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3806.8804,227.3969 L3806.8804,233.8969 A3.5,3.5 0 0 0 3810.3804,237.3969 L3816.8804,237.3969 L3806.8804,227.3969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="158.0503" x="3499.21" y="259.5966">Gate 1) Static validation</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="195.1968" x="3499.21" y="274.7294">- allowlist identifiers/functions</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="132.2344" x="3499.21" y="289.8622">- syntax correctness</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="137.541" x="3499.21" y="304.995">- complexity budgets</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3499.21" y="320.1278">&#160;</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="132.6914" x="3499.21" y="335.2606">Gate 2) Test vectors</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="270.937" x="3499.21" y="350.3935">- Given facts &#8594; expected outputs/reasons</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="186.5957" x="3499.21" y="365.5263">- publish fails if any test fails</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3499.21" y="380.6591">&#160;</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="106.3359" x="3499.21" y="395.7919">Publish Tx (SQL)</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="122.478" x="3499.21" y="410.9247">- status=Published</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="176.7124" x="3499.21" y="426.0575">- update pointer atomically</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3499.21" y="441.1903">&#160;</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="79.333" x="3499.21" y="456.3231">Post-publish</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="191.458" x="3499.21" y="471.456">- cache warm for hot rulesets</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="296.6704" x="3499.21" y="486.5888">- optional shadow evaluation &amp; canary rollout</text><line style="stroke:#181818;stroke-width:1;" x1="3494.21" x2="3522.3221" y1="239.9633" y2="239.9633"/><line style="stroke:#181818;stroke-width:1;" x1="3494.21" x2="3522.3221" y1="241.9633" y2="241.9633"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="265.4463" x="3522.3221" y="243.9638">Flow 2: Publish Pipeline (Draft &#8594; Publish)</text><line style="stroke:#181818;stroke-width:1;" x1="3787.7683" x2="3815.8804" y1="239.9633" y2="239.9633"/><line style="stroke:#181818;stroke-width:1;" x1="3787.7683" x2="3815.8804" y1="241.9633" y2="241.9633"/></g><g class="entity" data-qualified-name="GMN65" data-source-line="190" id="ent0066"><path d="M3837.51,1511.3369 L3837.51,1602.1338 A7,7 0 0 0 3844.51,1609.1338 L4283.5774,1609.1338 A7,7 0 0 0 4290.5774,1602.1338 L4290.5774,1514.3369 L4280.5774,1504.3369 L3844.51,1504.3369 A7,7 0 0 0 3837.51,1511.3369" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M4280.5774,1504.3369 L4280.5774,1510.8369 A3.5,3.5 0 0 0 4284.0774,1514.3369 L4290.5774,1514.3369 L4280.5774,1504.3369" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="337.0161" x="3843.51" y="1536.5366">If runtime errors spike or invalid behavior detected:</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="391.2188" x="3843.51" y="1551.6694">- Ops switches RuleSetPointer to previous published version</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="298.7715" x="3843.51" y="1566.8022">- Next request uses prior version immediately</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="426.0674" x="3843.51" y="1581.935">- Cache key changes &#8594; compiled delegates rebuilt for old version</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="142.2192" x="3843.51" y="1597.0678">No redeploy required.</text><line style="stroke:#181818;stroke-width:1;" x1="3838.51" x2="3931.9299" y1="1516.9033" y2="1516.9033"/><line style="stroke:#181818;stroke-width:1;" x1="3838.51" x2="3931.9299" y1="1518.9033" y2="1518.9033"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="264.2275" x="3931.9299" y="1520.9038">Flow 3: Last-Known-Good (LKG) Rollback</text><line style="stroke:#181818;stroke-width:1;" x1="4196.1575" x2="4289.5774" y1="1516.9033" y2="1516.9033"/><line style="stroke:#181818;stroke-width:1;" x1="4196.1575" x2="4289.5774" y1="1518.9033" y2="1518.9033"/></g><g class="entity" data-qualified-name="GMN68" data-source-line="202" id="ent0069"><path d="M4325.94,1513.3369 L4325.94,1600.1338 A7,7 0 0 0 4332.94,1607.1338 L4571.1534,1607.1338 A7,7 0 0 0 4578.1534,1600.1338 L4578.1534,1516.3369 L4568.1534,1506.3369 L4332.94,1506.3369 A7,7 0 0 0 4325.94,1513.3369" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M4568.1534,1506.3369 L4568.1534,1512.8369 A3.5,3.5 0 0 0 4571.6534,1516.3369 L4578.1534,1516.3369 L4568.1534,1506.3369" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="200.8081" x="4331.94" y="1523.4038">Safety contract (bounded DSL)</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="209.9741" x="4331.94" y="1538.5366">- allowlist identifiers + functions</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="222.3267" x="4331.94" y="1553.6694">- no reflection/dynamic invocation</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="146.7388" x="4331.94" y="1568.8022">- no IO, no side effects</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="223.2407" x="4331.94" y="1583.935">- publish-time validation preferred</text><text 