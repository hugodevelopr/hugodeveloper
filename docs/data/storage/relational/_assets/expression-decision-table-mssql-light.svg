/text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="221.8506" x="1398.99" y="1599.0678">- DecisionLog: audit + traceability</text></g><!--entity o11y--><g class="entity" data-qualified-name="platform.obsPkg.o11y" data-source-line="89" id="ent0031"><rect fill="#F1F1F1" height="52.5938" rx="7" ry="7" style="stroke:#181818;stroke-width:0.5;" width="159.2891" x="640.4" y="1350.2469"/><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="139.2891" x="650.4" y="1373.242">Logs/Metrics/Traces</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="119.7656" x="650.4" y="1389.5389">(OpenTelemetry)</text></g><!--entity alerts--><g class="entity" data-qualified-name="platform.obsPkg.alerts" data-source-line="90" id="ent0032"><rect fill="#F1F1F1" height="36.2969" rx="7" ry="7" style="stroke:#181818;stroke-width:0.5;" width="163.9307" x="637.08" y="1538.5869"/><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="143.9307" x="647.08" y="1561.582">Dashboards &amp; Alerts</text></g><!--entity policy--><g class="entity" data-qualified-name="policy" data-source-line="29" id="ent0002"><ellipse cx="3144.0458" cy="51.2969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M3144.0458,59.2969 L3144.0458,86.2969 M3131.0458,67.2969 L3157.0458,67.2969 M3144.0458,86.2969 L3131.0458,101.2969 M3144.0458,86.2969 L3157.0458,101.2969" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="90.9316" x="3098.58" y="115.792">Policy Owner</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="62.9111" x="3098.58" y="132.0889">(Analyst)</text></g><!--entity ops--><g class="entity" data-qualified-name="ops" data-source-line="30" id="ent0003"><ellipse cx="755.0415" cy="59.4469" fill="#F1F