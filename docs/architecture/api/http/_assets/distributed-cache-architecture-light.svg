60.1469" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.957" x="779.42" y="87.142">SQL Database</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.2529" x="779.42" y="103.4389">(Source of Truth)</text></g><!--entity concepts--><g class="entity" data-qualified-name="concepts" data-source-line="19" id="ent0009"><rect fill="#F1F1F1" height="52.5938" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="227.6074" x="614.24" y="591.4569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.7236" x="624.24" y="614.452">Key Concepts</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.6074" x="624.24" y="630.7489">(TTL &#8226; Eviction &#8226; Invalidation)</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="45" id="ent0025"><path d="M561.07,427.0869 L561.07,460.9169 L525.96,464.9169 L561.07,468.9169 L561.07,502.7509 A5,5 0 0 0 566.07,507.7509 L954.0192,507.7509 A5,5 0 0 0 959.0192,502.7509 L959.0192,432.0869 L949.0192,422.0869 L566.07,422.0869 A5,5 0 0 0 561.07,427.0869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M949.0192,422.0869 L949.0192,429.5869 A2.5,2.5 0 0 0 951.5192,432.0869 L959.0192,432.0869 L949.0192,422.0869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.5693" x="567.07" y="439.1538">- Network-mediated access</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.5181" x="567.07" y="454.2866">- Volatile by default</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.5088" x="567.07" y="469.4194">- Finite memory -&gt; eviction</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.9492" x="567.07" y="484.5522">- Single-threaded execution: slow commands hurt latency</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.8442" x="567.07" y="499.685">- Unavailability =&gt; fallback to DB (degrade, don't fail)</text></g><g class="entity" data-qualified-name="GMN27" data-source-line="53" id="ent0028"><path d="M1275.83,404.3869 L1275.83,525.4494 A5,5 0 0 0 1280.83,530.4494 L1593.2485,530.4494 A5,5 0 0 0 1598.2485,525.4494 L1598.2485,409.3869 L1588.2485,399.3869 L1280.83,399.3869 A5,5 0 0 0 1275.83,404.3869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1588.2485,399.3869 L1588.2485,406.8869 A2.5,2.5 0 0 0 1590.7485,409.3869 L1598.2485,409.3869 L1588.2485,399.3869" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.0986" x="1281.83" y="416.4538">Why this exists:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.6812" x="1281.83" y="431.5866">- Avoid duplicated per-instance caches</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.2759" x="1281.83" y="446.7194">- Reduce DB load under horizontal scale</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.7251" x="1281.83" y="461.8522">- Survive cold starts with shared warm cache</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.4019" x="1281.83" y="476.985">Failure modes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.3716" x="1281.83" y="492.1178">- Thundering herd on expiration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.4185" x="1281.83" y="507.2506">- Eviction drops hit rate -&gt; DB pressure spikes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3271" x="1281.83" y="522.3835">- Stale reads / race conditions</text></g><!--link client to apiA--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="21" id="lnk10"><path d="M336.47,82.0669 C260.81,83.1969 6,93.4669 77.04,181.0969 C121.9,236.4269 327.1664,258.3036 432.7264,266.1236" fill="none" id="client-to-apiA" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="438.71,266.5669,430.0301,261.9129,433.7237,266.1975,429.4391,269.891,438.71,266.5669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.5928" x="78.04" y="169.6638">GET /api/users/{id}/profile</text></g><!--link apiA to client--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="dependency" data-source-line="29" id="lnk15"><path d="M438.77,262.4469 C389.76,252.5869 323.59,230.4569 291.04,181.0969 C270.89,150.5369 305.3166,118.3782 331.4666,99.2582" fill="none" id="apiA-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="336.31,95.7169,326.684,97.8,332.2738,98.668,331.4058,104.2579,336.31,95.7169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.7026" x="310.3022" y="162.1638">200 OK</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.2271" x="292.04" y="177.2966">(low latency)</text></g><!--link client to apiB--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="22" id="lnk11"><path d="M369.37,119.1169 C378.77,141.1469 394.07,167.3769 417.04,181.0969 C447.61,199.3469 544.69,174.226