essage" data-entity-1="part4" data-entity-2="part5" id="msg4"><polygon fill="#111827" points="579.6382,322.8203,589.6382,326.8203,579.6382,330.8203,583.6382,326.8203" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="381.6479" x2="585.6382" y1="326.8203" y2="326.8203"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="144.4346" x="388.6479" y="306.6216">Forward HTTP request</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="119.3994" x="388.6479" y="321.7544">(headers + query)</text></g><g class="message" data-entity-1="part5" data-entity-2="part6" id="msg5"><polygon fill="#111827" points="777.1387,351.9531,787.1387,355.9531,777.1387,359.9531,781.1387,355.9531" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="591.6382" x2="783.1387" y1="355.9531" y2="355.9531"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="173.5005" x="598.6382" y="350.8872">Extract fields query param</text></g><g class="message" data-entity-1="part6" data-entity-2="part7" id="msg6"><polygon fill="#111827" points="969.7959,381.0859,979.7959,385.0859,969.7959,389.0859,973.7959,385.0859" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="789.1387" x2="975.7959" y1="385.0859" y2="385.0859"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="168.6572" x="796.1387" y="380.02">Validate field names exist</text></g><g class="message" data-entity-1="part7" data-entity-2="part8" id="msg7"><polygon fill="#111827" points="1190.7764,425.3516,1200.7764,429.3516,1190.7764,433.3516,1194.7764,429.3516" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="981.7959" x2="1196.7764" y1="429.3516" y2="429.3516"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="140.4736" x="988.7959" y="409.1528">Check exposure rules</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="196.9805" x="988.7959" y="424.2856">(field allowlist per role/tenant)</text></g><g class="message" data-entity-1="part8" data-entity-2="part9" id="msg8"><polygon fill="#111827" points="1436.1978,499.8828,1446.1978,503.8828,1436.1978,507.8828,1440.1978,503.8828" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="1202.7764" x2="1442.1978" y1="503.8828" y2="503.8828"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="128.2607" x="1209.7764" y="453.4185">Normalize selection</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="167.6226" x="1209.7764" y="468.5513">- apply defaults if missing</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="129.4922" x="1209.7764" y="483.6841">- enforce max fields</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="109.7319" x="1209.7764" y="498.8169">- canonical order</text></g><g class="message" data-entity-1="part9" data-entity-2="part10" id="msg9"><polygon fill="#111827" points="1670.5415,544.1484,1680.5415,548.1484,1670.5415,552.1484,1674.5415,548.1484" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="1448.1978" x2="1676.5415" y1="548.1484" y2="548.1484"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="187.6177" x="1455.1978" y="527.9497">Compute cache key strategy</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="161.9414" x="1455.1978" y="543.0825">Vary: fields, auth, tenant</text></g><g class="message" data-entity-1="part10" data-entity-2="part15" id="msg10"><polygon fill="#111827" points="2704.1201,588.4141,2714.1201,592.4141,2704.1201,596.4141,2708.1201,592.4141" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="1682.5415" x2="2710.1201" y1="592.4141" y2="592.4141"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="129.6636" x="1689.5415" y="572.2153">Emit tags/attributes</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="279.1255" x="1689.5415" y="587.3481">(fields_count, canonical_fields, client_type)</text></g><path d="M794,612.4141 L794,683.4141 A7,7 0 0 0 801,690.4141 L1124,690.4141 A7,7 0 0 0 1131,683.4141 L1131,615.4141 L1121,605.4141 L801,605.4141 A7,7 0 0 0 794,612.4141" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M1121,605.4141 L1121,611.9141 A3.5,3.5 0 0 0 1124.5,615.4141 L1131,615.4141 L1121,605.4141" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="93.1201" x="800" y="622.481">Mental model:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="316.5195" x="800" y="637.6138">- Resource is stable; representation is projected.</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="275.1074" x="800" y="652.7466">- Client declares "what fields are needed".</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="62.3721" x="800" y="667.8794">Invariant:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="258.978" x="800" y="683.0122">- Omitted fields MUST NOT be returned.</text><path d="M986,708.0781 L986,764.0781 A7,7 0 0 0 993,771.0781 L1347,771.0781 A7,7 0 0 0 1354,764.0781 L1354,711.0781 L1344,701.0781 L993,701.0781 A7,7 0 0 0 986,708.0781" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M1344,701.0781 L1344,707.5781 A3.5,3.5 0 0 0 1347.5,711.0781 L1354,711.0781 L1344,701.0781" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="152.9023" x="992" y="718.145">Server-owned contract:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="242.8042" x="992" y="733.2778">- Explicit field registry (no reflection).</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="223.5073" x="992" y="748.4106">- Unknown fields -&gt; 400 (fail fast).</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="347.1533" x="992" y="763.5435">- Prevents accidental exposure of internal properties.</text><path d="M1207,788.6094 L1207,844.6094 A7,7 0 0 0 1214,851.6094 L1541,851.6094 A7,7 0 0 0 1548,844.6094 L1548,791.6094 L1538,781.6094 L1214,781.6094 A7,7 0 0 0 1207,788.6094" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M1538,781.6094 L1538,788.1094 A3.5,3.5 0 0 0 1541.5,791.6094 L1548,791.6094 L1538,781.6094" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="174.5161" x="1213" y="798.6763">Security is non-negotiable:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="179.8672" x="1213" y="813.8091">- Field-level authz gates PII.</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="320.0298" x="1213" y="828.9419">- Multi-tenant constraints apply BEFORE shaping.</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="230.293" x="1213" y="844.0747">- "fields" must never bypass policy.</text><rect fill="#EEEEEE" height="3" rx="7" ry="7" style="stroke:#EEEEEE;stroke-width:1;" width="2999.2368" x="0" y="877.707"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2999.2368" y1="877.707" y2="877.707"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2999.2368" y1="880.707" y2="880.707"/><rect fill="#EEEEEE" height="23.1328" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="227.2305" x="1386.0032" y="867.1406"/><text fill="#000000" font-family="Inter" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208.7046" x="1392.0032" y="883.2075">Cache-aware execution path</text><g class="message" data-entity-1="part10" data-entity-2="part14" id="msg11"><polygon fill="#111827" points="2457.2222,932.5391,2467.2222,936.5391,2457.2222,940.5391,2461.2222,936.5391" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="1682.5415" x2="2463.2222" y1="936.5391" y2="936.5391"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="143.3999" x="1689.5415" y="916.3403">Attempt cache lookup</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="137.1855" x="1689.5415" y="931.4731">(OutputCache / CDN)</text></g><path d="M17,951.5391 L74.4429,951.5391 L74.4429,958.6719 L64.4429,968.6719 L10,968.6719 L10,958.5391 A7,7 0 0 1 17,951.5391" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="472.3281" rx="7" ry="7" style="stroke:#000000;stroke-width:1.5;" width="2590.4585" x="10" y="951.5391"/><text fill="#000000" font-family="Inter" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="19.4429" x="25" y="964.606">alt</text><text fill="#000000" font-family="Inter" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="71.9941" x="89.4429" y="963.7495">[Cache HIT]</text><g class="message" data-entity-1="part14" data-entity-2="part5" id="msg12"><polygon fill="#111827" points="602.6382,985.8047,592.6382,989.8047,602.6382,993.8047,598.6382,989.8047" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;stroke-dasharray:2,2;" x1="596.6382" x2="2468.2222" y1="989.8047" y2="989.8047"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="163.7568" x="608.6382" y="984.7388">Cached shaped response</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg13"><polygon fill="#111827" points="392.6479,1014.9375,382.6479,1018.9375,392.6479,1022.9375,388.6479,1018.9375" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;stroke-dasharray:2,2;" x1="386.6479" x2="590.6382" y1="1018.9375" y2="1018.9375"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="109.459" x="398.6479" y="1013.8716">200 OK (shaped)</text></g><g class="message" data-entity-1="part4" data-entity-2="part1" id="msg14"><polygon fill="#111827" points="64.5464,1044.0703,54.5464,1048.0703,64.5464,1052.0703,60.5464,1048.0703" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;stroke-dasharray:2,2;" x1="58.5464" x2="380.6479" y1="1048.0703" y2="1048.0703"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="140.1499" x="70.5464" y="1043.0044">JSON (selected fields)</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="2600.4585" y1="1057.0703" y2="1057.0703"/><text fill="#000000" font-family="Inter" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="82.0757" x="15" y="1067.2808">[Cache MISS]</text><g class="message" data-entity-1="part10" data-entity-2="part11" id="msg15"><polygon fill="#111827" points="1882.8394,1103.1406,1892.8394,1107.1406,1882.8394,1111.1406,1886.8394,1107.1406" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="1682.5415" x2="1888.8394" y1="1107.1406" y2="1107.1406"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="106.4946" x="1689.5415" y="1086.9419">Build query plan</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="115.8384" x="1689.5415" y="1102.0747">for selected fields</text></g><g class="message" data-entity-1="part11" data-entity-2="part12" id="msg16"><polygon fill="#111827" points="2074.4209,1147.4063,2084.4209,1151.4063,2074.4209,1155.4063,2078.4209,1151.4063" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="1894.8394" x2="2080.4209" y1="1151.4063" y2="1151.4063"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="159.834" x="1901.8394" y="1131.2075">Execute projected query</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="166.4863" x="1901.8394" y="1146.3403">(only requested columns)</text></g><g class="message" data-entity-1="part12" data-entity-2="part13" id="msg17"><polygon fill="#111827" points="2275.5205,1206.8047,2285.5205,1210.8047,2275.5205,1214.8047,2279.5205,1210.8047" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="2086.4209" x2="2281.5205" y1="1210.8047" y2="1210.8047"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="129.4858" x="2093.4209" y="1175.4731">SELECT &lt;columns&gt;</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="112.0107" x="2093.4209" y="1190.606">FROM Customers</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="87.5977" x="2093.4209" y="1205.7388">WHERE Id=...</text></g><g class="message" data-entity-1="part13" data-entity-2="part12" id="msg18"><polygon fill="#111827" points="2097.4209,1235.9375,2087.4209,1239.9375,2097.4209,1243.9375,2093.4209,1239.9375" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;stroke-dasharray:2,2;" x1="2091.4209" x2="2286.5205" y1="1239.9375" y2="1239.9375"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="177.0996" x="2103.4209" y="1234.8716">Row with selected columns</text></g><g class="message" data-entity-1="part12" data-entity-2="part14" id="msg19"><polygon fill="#111827" points="2457.2222,1280.2031,2467.2222,1284.2031,2457.2222,1288.2031,2461.2222,1284.2031" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="2086.4209" x2="2463.2222" y1="1284.2031" y2="1284.2031"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="171.1074" x="2093.4209" y="1264.0044">Materialize minimal shape</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="109.3828" x="2093.4209" y="1279.1372">(Dictionary/DTO)</text></g><g class="message" data-entity-1="part14" data-entity-2="part10" id="msg20"><polygon fill="#111827" points="1693.5415,1324.4688,1683.5415,1328.4688,1693.5415,1332.4688,1689.5415,1328.4688" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;" x1="1687.5415" x2="2468.2222" y1="1328.4688" y2="1328.4688"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="149.7222" x="1699.5415" y="1308.27">Store shaped response</text><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="178.7881" x="1699.5415" y="1323.4028">(cacheable only when safe)</text></g><g class="message" data-entity-1="part14" data-entity-2="part5" id="msg21"><polygon fill="#111827" points="602.6382,1353.6016,592.6382,1357.6016,602.6382,1361.6016,598.6382,1357.6016" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;stroke-dasharray:2,2;" x1="596.6382" x2="2468.2222" y1="1357.6016" y2="1357.6016"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="112.4233" x="608.6382" y="1352.5356">Shaped response</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg22"><polygon fill="#111827" points="392.6479,1382.7344,382.6479,1386.7344,392.6479,1390.7344,388.6479,1386.7344" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;stroke-dasharray:2,2;" x1="386.6479" x2="590.6382" y1="1386.7344" y2="1386.7344"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="109.459" x="398.6479" y="1381.6685">200 OK (shaped)</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg23"><polygon fill="#111827" points="139.5166,1411.8672,129.5166,1415.8672,139.5166,1419.8672,135.5166,1415.8672" style="stroke:#111827;stroke-width:1;"/><line style="stroke:#111827;stroke-width:1.2;stroke-dasharray:2,2;" x1="133.5166" x2="380.6479" y1="1415.8672" y2="1415.8672"/><text fill="#000000" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="140.1499" x="145.5166" y="1410.8013">JSON (selected fields)</text></g><path d="M1899,1442.8672 L1899,1528.8672 A7,7 0 0 0 1906,1535.8672 L2173,1535.8672 A7,7 0 0 0 2180,1528.8672 L2180,1445.8672 L2170,1435.8672 L1906,1435.8672 A7,7 0 0 0 1899,1442.8672" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M2170,1435.8672 L2170,1442.3672 A3.5,3.5 0 0 0 2173.5,1445.8672 L2180,1445.8672 L2170,1435.8672" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="116.7778" x="1905" y="1452.9341">Performance rule:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="259.8032" x="1905" y="1468.0669">- Projection must influence data access.</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="29.5166" x="1905" y="1483.1997">Bad:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="260.9141" x="1905" y="1498.3325">- Load full entity -&gt; trim at serialization.</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="38.6128" x="1905" y="1513.4653">Good:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="234.0127" x="1905" y="1528.5981">- Push projection into SQL/EF query.</text><path d="M1687,1553.6641 L1687,1639.6641 A7,7 0 0 0 1694,1646.6641 L2011,1646.6641 A7,7 0 0 0 2018,1639.6641 L2018,1556.6641 L2008,1546.6641 L1694,1546.6641 A7,7 0 0 0 1687,1553.6641" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M2008,1546.6641 L2008,1553.1641 A3.5,3.5 0 0 0 2011.5,1556.6641 L2018,1556.6641 L2008,1546.6641" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="84.3032" x="1693" y="1563.731">Caching risk:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="310.064" x="1693" y="1578.8638">- Field combinations increase cache cardinality.</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="75.8101" x="1693" y="1593.9966">Mitigations:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="176.7568" x="1693" y="1609.1294">- Canonical order for fields.</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="252.7827" x="1693" y="1624.2622">- Default field sets for common clients.</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="296.0928" x="1693" y="1639.395">- Max field count and/or allow known presets.</text><path d="M2721,1664.4609 L2721,1750.4609 A7,7 0 0 0 2728,1757.4609 L2987,1757.4609 A7,7 0 0 0 2994,1750.4609 L2994,1667.4609 L2984,1657.4609 L2728,1657.4609 A7,7 0 0 0 2721,1664.4609" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M2984,1657.4609 L2984,1663.9609 A3.5,3.5 0 0 0 2987.5,1667.4609 L2994,1667.4609 L2984,1657.4609" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="139.877" x="2727" y="1674.5278">Observability signals:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="102.832" x="2727" y="1689.6606">- payload_bytes</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="165.0391" x="2727" y="1704.7935">- fields_count distribution</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="252.2368" x="2727" y="1719.9263">- latency (p95/p99) by canonical_fields</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="179.3721" x="2727" y="1735.0591">- cache_hit_ratio by fieldset</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="187.6685" x="2727" y="1750.1919">- db_time &amp; fetched columns</text><rect fill="#EEEEEE" height="3" rx="7" ry="7" style="stroke:#EEEEEE;stroke-width:1;" width="2999.2368" x="0" y="1783.8242"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2999.2368" y1="1783.8242" y2="1783.8242"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2999.2368" y1="1786.8242" y2="1786.8242"/><rect fill="#EEEEEE" height="23.1328" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="221.5303" x="1388.8533" y="1773.2578"/><text fill="#000000" font-family="Inter" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="203.0044" x="1394.8533" y="1789.3247">Design options &amp; trade-offs</text><path d="M505,1818.3906 L505,2040.3906 A7,7 0 0 0 512,2047.3906 L2547,2047.3906 A7,7 0 0 0 2554,2040.3906 L2554,1821.3906 L2544,1811.3906 L512,1811.3906 A7,7 0 0 0 505,1818.3906" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M2544,1811.3906 L2544,1817.8906 A3.5,3.5 0 0 0 2547.5,1821.3906 L2554,1821.3906 L2544,1811.3906" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="139.0454" x="1336.575" y="1828.4575">Option A: Fixed DTOs</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="166.4165" x="1344.8396" y="1843.5903">+ Simple, tooling-friendly</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="218.334" x="1344.8396" y="1858.7231">- DTO explosion, slower evolution</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1336.575" y="1873.856">&#160;</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="377.8252" x="1336.575" y="1888.9888">Option B: Multiple endpoints (/summary, /details, /mobile)</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="169.0825" x="1344.8396" y="1904.1216">+ Explicit representations</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="219.7178" x="1344.8396" y="1919.2544">- Endpoint sprawl, ownership drift</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1336.575" y="1934.3872">&#160;</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="122.459" x="1336.575" y="1949.52">Option C: GraphQL</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="217.4199" x="1344.8396" y="1964.6528">+ Powerful selection/composition</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="194.9619" x="1344.8396" y="1979.7856">- Operational + cognitive cost</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1336.575" y="1994.9185">&#160;</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="210.3486" x="1336.575" y="2010.0513">Option D: Sparse Fieldsets (this)</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="245.7305" x="1344.8396" y="2025.1841">+ Efficient + evolvable REST contract</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="253.3794" x="1344.8396" y="2040.3169">- Validation, authz, caching complexity</text><rect fill="#EEEEEE" height="3" rx="7" ry="7" style="stroke:#EEEEEE;stroke-width:1;" width="2999.2368" x="0" y="2073.9492"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2999.2368" y1="2073.9492" y2="2073.9492"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2999.2368" y1="2076.9492" y2="2076.9492"/><rect fill="#EEEEEE" height="23.1328" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="323.0483" x="1338.0942" y="2063.3828"/><text fill="#000000" font-family="Inter" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="304.5225" x="1344.0942" y="2079.4497">Common mistakes (earned in production)</text><path d="M702,2108.5156 L702,2330.5156 A7,7 0 0 0 709,2337.5156 L1762,2337.5156 A7,7 0 0 0 1769,2330.5156 L1769,2111.5156 L1759,2101.5156 L709,2101.5156 A7,7 0 0 0 702,2108.5156" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M1759,2101.5156 L1759,2108.0156 A3.5,3.5 0 0 0 1762.5,2111.5156 L1769,2111.5156 L1759,2101.5156" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="189.7505" x="1042.3611" y="2118.5825">1) Shape only at serialization</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="193.5718" x="1054.7581" y="2133.7153">Effect: DB/CPU still over-fetch</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="163.2173" x="1054.7581" y="2148.8481">Fix: projection pushdown</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1042.3611" y="2163.981">&#160;</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="151.8867" x="1042.3611" y="2179.1138">2) Allow arbitrary fields</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="184.1646" x="1054.7581" y="2194.2466">Effect: leaks + contract drift</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="251.875" x="1054.7581" y="2209.3794">Fix: explicit registry + field-level authz</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1042.3611" y="2224.5122">&#160;</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="201.1445" x="1042.3611" y="2239.645">3) Return missing fields as null</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="364.9839" x="1054.7581" y="2254.7778">Effect: semantics break ("unknown" vs "not requested")</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="182.1396" x="1054.7581" y="2269.9106">Fix: omit unrequested fields</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1042.3611" y="2285.0435">&#160;</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="216.2393" x="1042.3611" y="2300.1763">4) Unbounded field combinations</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="181.7588" x="1054.7581" y="2315.3091">Effect: cache fragmentation</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="179.9434" x="1054.7581" y="2330.4419">Fix: defaults, presets, limits</text><rect fill="#EEEEEE" height="3" rx="7" ry="7" style="stroke:#EEEEEE;stroke-width:1;" width="2999.2368" x="0" y="2364.0742"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2999.2368" y1="2364.0742" y2="2364.0742"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2999.2368" y1="2367.0742" y2="2367.0742"/><rect fill="#EEEEEE" height="23.1328" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="145.5234" x="1426.8567" y="2353.5078"/><text fill="#000000" font-family="Inter" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.9976" x="1432.8567" y="2369.5747">When NOT to use</text><path d="M889,2398.6406 L889,2469.6406 A7,7 0 0 0 896,2476.6406 L1286,2476.6406 A7,7 0 0 0 1293,2469.6406 L1293,2401.6406 L1283,2391.6406 L896,2391.6406 A7,7 0 0 0 889,2398.6406" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><path d="M1283,2391.6406 L1283,2398.1406 A3.5,3.5 0 0 0 1286.5,2401.6406 L1293,2401.6406 L1283,2391.6406" fill="#FFFFFF" style="stroke:#6B7280;stroke-width:0.5;"/><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="186.0879" x="922.9153" y="2408.7075">Avoid sparse fieldsets when:</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="268.4487" x="922.9153" y="2423.8403">- Single internal client with tight coupling</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="222.8916" x="922.9153" y="2438.9731">- Payloads are small / traffic is low</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="327.9707" x="922.9153" y="2454.106">- Fixed schemas are mandated (compliance/audit)</text><text fill="#111827" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="268.3662" x="922.9153" y="2469.2388">- Team cannot sustain contract discipline</text><rect fill="none" height="205.5625" rx="7" ry="7" style="stroke:#000000;stroke-width:1;" width="494.4561" x="12" y="2600.8984"/><line style="stroke:#000000;stroke-width:1;" x1="12" x2="169.9199" y1="2614.0469" y2="2614.0469"/><line style="stroke:#000000;stroke-width:1;" x1="12" x2="169.9199" y1="2616.0469" y2="2616.0469"/><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="169.7158" x="174.3701" y="2618.3936">HTTP Response Shaping</text><line style="stroke:#000000;stroke-width:1;" x1="348.5361" x2="506.4561" y1="2614.0469" y2="2614.0469"/><line style="stroke:#000000;stroke-width:1;" x1="348.5361" x2="506.4561" y1="2616.0469" y2="2616.0469"/><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="36.5996" x="17" y="2635.1904">Goal:</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="265.5762" x="17" y="2651.4873">- Reduce payload + CPU + bandwidth</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="383.6875" x="17" y="2667.7842">- Keep REST resource stable while allowing projections</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17" y="2684.0811">&#160;</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="104.7539" x="17" y="2700.3779">Key invariants:</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="226.9121" x="17" y="2716.6748">- Explicit client intent (fields=...)</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="272.583" x="17" y="2732.9717">- Server-owned allowlist &amp; policy gates</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="243.0791" x="17" y="2749.2686">- Projection pushdown into queries</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17" y="2765.5654">&#160;</text><text fill="#000000" font-family="Inter" font-size="14" lengthAdj