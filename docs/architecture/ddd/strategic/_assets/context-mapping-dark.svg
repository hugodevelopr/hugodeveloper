<path d="M6,438.1937 L6,524.9906 A7,7 0 0 0 13,531.9906 L361.4277,531.9906 A7,7 0 0 0 368.4277,524.9906 L368.4277,441.1937 L358.4277,431.1937 L191.21,431.1937 L187.21,396.3937 L183.21,431.1937 L13,431.1937 A7,7 0 0 0 6,438.1937" fill="#714137" filter="url(#f1he7s4cogedam)" style="stroke:#E7E7E7;stroke-width:0.5;"/><path d="M358.4277,431.1937 L358.4277,437.6937 A3.5,3.5 0 0 0 361.9277,441.1937 L368.4277,441.1937 L358.4277,431.1937" fill="#714137" style="stroke:#E7E7E7;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="218.3721" x="12" y="448.2606">Pick the relationship deliberately:</text><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="237.7388" x="12" y="463.3935">- Customer-Supplier (most common)</text><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="179.6069" x="12" y="478.5263">- Conformist (fast but risky)</text><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="211.6499" x="12" y="493.6591">- Partnership (high coordination)</text><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="301.1772" x="12" y="508.7919">Use ACL when protecting your model matters.</text><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="341.4277" x="12" y="523.9247">Use OHS + Published Language to scale integration.</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="49" id="ent0024"><path d="M432.09,92.3337 L432.09,116.5938 L279.41,120.5938 L432.09,124.5938 L432.09,148.865 A7,7 0 0 0 439.09,155.865 L637.0212,155.865 A7,7 0 0 0 644.0212,148.865 L644.0212,95.3337 L634.0212,85.3337 L439.09,85.3337 A7,7 0 0 0 432.09,92.3337" fill="#714137" filter="url(#f1he7s4cogedam)" style="stroke:#E7E7E7;stroke-width:0.5;"/><path d="M634.0212,85.3337 L634.0212,91.8337 A3.5,3.5 0 0 0 637.5212,95.3337 L644.0212,95.3337 L634.0212,85.3337" fill="#714137" style="stroke:#E7E7E7;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="99.5376" x="438.09" y="102.4006">Use only when:</text><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="178.439" x="438.09" y="117.5335">- shared core is truly stable</text><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="190.9312" x="438.09" y="132.6663">- teams accept tight coupling</text><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="113.8008" x="438.09" y="147.7991">Otherwise, avoid.</text></g><!--link CustModel to OHS--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="29" id="lnk13"><path d="M644.89,248.3237 C682.08,249.2838 717.492,250.1994 753.242,251.1194" fill="none" id="CustModel-to-OHS" style="stroke:#E7E7E7;stroke-width:1.2;"/><polygon fill="#E7E7E7" points="759.24,251.2737,750.3459,247.0435,754.2417,251.1451,750.1401,255.0409,759.24,251.2737" style="stroke:#E7E7E7;stroke-width:1.2;"/><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="53.4409" x="675.69" y="245.6606">exposes</text></g><!--link CustEvents to ACL--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" data-link-type="dependency" data-source-line="30" id="lnk14"><path d="M634.34,331.4938 C742.48,327.9638 911.8832,322.4391 1020.2232,318.9091" fill="none" id="CustEvents-to-ACL" style="stroke:#E7E7E7;stroke-width:1.2;"/><polygon fill="#E7E7E7" points="1026.22,318.7138,1017.0945,315.009,1021.2227,318.8766,1017.355,323.0047,1026.22,318.7138" style="stroke:#E7E7E7;stroke-width:1.2;"/><text fill="#FFFFFF" font-family="Inter" font-size="13" lengthAdjust="spacing" textLength="43.7988" x="828.61" y="317.6606">events</text></g><!--link OHS to ACL--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008"