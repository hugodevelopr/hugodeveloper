-width:0.5;" width="133.9482" x="263.52" y="342.0869"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.8721" x="273.52" y="365.082">Job Code</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.9482" x="273.52" y="381.3789">(Business Logic)</text></g><!--entity ops--><g class="entity" data-qualified-name="ops" data-source-line="14" id="ent0008"><rect fill="#313139" height="52.5938" rx="5" ry="5" style="stroke:#E7E7E7;stroke-width:0.5;" width="202.6221" x="685.18" y="342.0869"/><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="27.2002" x="695.18" y="365.082">Ops</text><text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.6221" x="695.18" y="381.3789">(Dashboard + Monitoring)</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="32" id="ent0020"><path d="M432.69,345.6869 L432.69,364.3869 L397.66,368.3869 L432.69,372.3869 L432.69,391.0853 A5,5 0 0 0 437.69,396.0853 L645.2833,396.0853 A5,5 0 0 0 650.2833,391.0853 L650.2833,350.6869 L640.2833,340.6869 L437.69,340.6869 A5,5 0 0 0 432.69,345.6869" fill="#714137" style="stroke:#E7E7E7;stroke-width:0.5;"/><path d="M640.2833,340.6869 L640.2833,348.1869 A2.5,2.5 0 0 0 642.7833,350.6869 L650.2833,350.6869 L640.2833,340.6869" fill="#714137" style="stroke:#E7E7E7;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.647" x="438.69" y="357.7538">At-least-once execution:</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5933" x="438.69" y="372.8866">Jobs may run more than once.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.0864" x="438.69" y="388.0194">Idempotency is mandatory.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="38" id="ent0023"><path d="M6,687.0869 L6,747.6181 A5,5 0 0 0 11,752.6181 L205.9805,752.6181 A5,5 0 0 0 210.9805,747.6181 L210.9805,692.0869 L200.9805,682.0869 L11,682.0869 A5,5 0 0 0 6,687.0869" fill="#714137" style="stroke:#E7E7E7;stroke-width:0.5;"/><path d="M200.9805,682.0869 L200.9805,689.5869 A2.5,2.5 0 0 0 203.4805,692.0869 L210.9805,692.0869 L200.9805,682.0869" fill="#714137" style="stroke:#E7E7E7;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.2266" x="12" y="699.1538">DB is source of truth:</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.5376" x="12" y="714.2866">durability + visibility,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.9805" x="12" y="729.4194">but throughput/locks/polling</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.667" x="12" y="744.5522">become the bottleneck.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="45" id="ent0026"><path d="M245.81,694.6569 L245.81,740.0553 A5,5 0 0 0 250.81,745.0553 L450.1704,745.0553 A5,5 0 0 0 455.1704,740.0553 L455.1704,721.3469 L489.8,717.3469 L455.1704,713.3469 L455.1704,699.6569 L445.1704,689.6569 L250.81,689.6569 A5,5 0 0 0 245.81,694.6569" fill="#714137" style="stroke:#E7E7E7;stroke-width:0.5;"/><path d="M445.1704,689.6569 L445.1704,697.1569 A2.5,2.5 0 0 0 447.6704,699.6569 L455.1704,699.6569 L445.1704,689.6569" fill="#714137" style="stroke:#E7E7E7;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.5981" x="251.81" y="706.7238">Scale by adding workers,</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.3604" x="251.81" y="721.8566">but polling + lock contention</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.667" x="251.81" y="736.9894">increase with worker count.</text></g><!--link client to web--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk9"><path d="M123.49,119.3169 C123.49,143.5169 123.49,168.3969 123.49,189.8269" fill="none" id="client-to-web" style="stroke:#E7E7E7;stroke-width:1;"/><polygon fill="#E7E7E7" points="123.49,195.8269,127.49,186.8269,123.49,190.8269,119.49,186.8269,123.49,195.8269" style="stroke:#E7E7E7;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.3311" x="124.49" y="162.1638">HTTP request</text></g><!--link web to hfclient--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk10"><path d="M123.49,249.1369 C123.49,275.3469 123.49,309.7369 123.49,335.8669" fill="none" id="web-to-hfclient" style="stroke:#E7E7E7;stroke-width:1;"/><polygon fill="#E7E7E7" points="123.49,341.8669,127.49,332.8669,123.49,336.8669,119.49,332.8669,123.49,341.8669" style="stroke:#E7E7E7;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.2266" x="129.8189" y="291.7538">Enqueue(jobId)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.8843" x="124.49" y="306.8866">+ args (IDs only)</text></g><!--link hfclient to db--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="18" id="lnk11"><path d="M116.05,394.8469 C111.12,416.8769 107.66,448.9069 120.49,473.0869 C127.94,487.1269 135.0541,495.2144 148.0741,504.4944" fill="none" id="hfclient-to-db" style="stroke:#E7E7E7;stroke-width:1;"/><polygon fill="#E7E7E7" points="152.96,507.9769,147.9527,499.4959,148.8884,505.0748,143.3094,506.0105,152.96,507.9769" style="stroke:#E7E7E7;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71.1699" x="168.761" y="439.1538">INSERT Job</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.7349" x="148.9785" y="454.2866">State=Enqueued</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.7119" x="121.49" y="469.4194">(serialize method + args)</text></g><!--link workers to db--><g class="link" data-entity-1="ent0006" data-entity-2="ent0005" data-link-type="dependency" data-source-line="20" id="lnk12"><path d="M499.53,690.7169 C490.62,687.3769 481.41,684.3369 472.49,682.0869 C410.11,666.3169 227.57,699.8869 184.49,652.0869 C164.18,629.5569 175.4826,600.0665 190.9526,575.2865" fill="none" id="workers-to-db" style="stroke:#E7E7E7;stroke-width:1;"/><polygon fill="#E7E7E7" points="194.13,570.1969,185.9708,575.713,191.4822,574.4382,192.757,579.9496,194.13,570.1969" style="stroke:#E7E7E7;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.3032" x="217.0347" y="625.6538">Poll Enqueued jobs</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.3926" x="185.49" y="640.7866">(queues: critical/default/low)</text></g><!--link db to workers--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="21" id="lnk13"><path d="M291.69,561.3269 C320.04,571.6269 351.46,585.9969 376.49,605.0869 C397.41,621.0369 391.86,635.7469 412.49,652.0869 C419.69,657.7869 453.559,672.9744 489.169,688.3044" fill="none" id="db-to-workers" style="stroke:#E7E7E7;stroke-width:1;"/><polygon fill="#E7E7E7" points="494.68,690.6769,487.9951,683.4441,490.0875,688.6998,484.8318,690.7922,494.68,690.6769" style="stroke:#E7E7E7;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" text